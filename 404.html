<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found – Pixelish Launcher</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
  // Old desktop download links (/downloads, /downloads/...) now live on GitHub Releases.
  // Runs in <head>, before anything renders.
  (function () {
    var REL = 'https://github.com/XxNoelW/dungeon-adventure/releases/tag/v1.2.0';
    if (/^\/downloads(\/|$)/i.test(location.pathname)) {
      document.write('<meta http-equiv="refresh" content="0; url=' + REL + '"><style>body{visibility:hidden}</style>');
      location.replace(REL);
    }
  })();
</script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0a12;color:#f3ead7;font-family:ui-monospace,Menlo,monospace;text-align:center}
  a{color:#ffd84a}
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>

</body>
</html>
